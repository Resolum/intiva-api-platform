version: "3.8"

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:17-alpine
    container_name: intiva_postgres
    environment:
      POSTGRES_DB: intiva_platform
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # postgres_data: Persists database storage beyond the lifecycle of the container.
      # If the database container is destroyed/rebuilt, data is not lost.
      - postgres_data:/var/lib/postgresql/data
    # expose: Lists ports internally within the virtual network.
    # It does not bind the port to the host machine. External clients cannot connect directly to the DB.
    expose:
      - "5432"
    networks:
      # intiva_internal: Connects the container to the isolated internal network.
      - intiva_internal
    healthcheck:
      # Verifies if the DB is ready to accept connections before other services try to connect.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d intiva_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: intiva_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    # expose: Internal only network listing. Port 6379 is not bound to the host machine.
    expose:
      - "6379"
    networks:
      - intiva_internal
    healthcheck:
      # Pings Redis CLI to confirm server responsiveness and operational health.
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend Service
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: intiva_backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/intiva_platform
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
    # expose: Port 8080 is internal-only. Prevents external access while letting Nginx connect to it.
    expose:
      - "8080"
    depends_on:
      # depends_on with condition service_healthy:
      # Ensures backend container wait to boot until postgres and redis are fully operational
      # (passing health check commands), avoiding startup database connection errors.
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - intiva_internal
    restart: unless-stopped

  # Nginx API Gateway Reverse Proxy Service
  nginx:
    image: nginx:alpine
    container_name: intiva_nginx
    ports:
      # ports: Maps port 80 on the host machine to port 80 inside the container.
      # Nginx is the ONLY service exposing public ports, making it the system entry gate.
      - "80:80"
    volumes:
      # Mounts local configuration file as Read-Only (:ro) inside the container.
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      # Nginx depends on the backend to be initialized to route requests.
      - backend
    networks:
      - intiva_internal
    restart: unless-stopped

volumes:
  # Named volume declaration to ensure persistent storage for database records
  postgres_data:

networks:
  # Isolated virtual bridge network to contain backend microservices
  # and block direct external communication.
  intiva_internal:
    driver: bridge
