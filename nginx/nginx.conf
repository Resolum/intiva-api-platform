events {
    # Maximum simultaneous connections per worker process
    worker_connections 1024;
}

http {

    # -----------------------------------------------------------
    # Logging Config
    # -----------------------------------------------------------
    # Defines a custom log format to record details about client requests
    # including IP address, user, request time, status, bytes sent, referer, and agent.
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    # Write logs to standard Nginx file locations
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # -----------------------------------------------------------
    # Upstream: Spring Boot Backend
    # -----------------------------------------------------------
    # Defines a pool of backend servers. Nginx forwards requests here.
    # The address "backend:8080" uses the service name defined in
    # docker-compose.yml, which is resolved dynamically by Docker's DNS.
    # Port 8080 is internal-only and inaccessible directly from external networks.
    upstream intiva_backend {
        server backend:8080;
        # keepalive 32 allows Nginx to cache and reuse up to 32 idle connections
        # to the backend server, reducing TCP handshake overhead and improving response times.
        keepalive 32;
    }

    server {
        # Listen on port 80 - this is the only publicly exposed port in the gateway
        listen 80;
        server_name _;
        
        # IAM Context - Authentication & Authorization Bounded Context
        location /api/v1/authentication/ {
            proxy_pass         http://intiva_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
        }

        # IAM Context - Users Management Bounded Context
        location /api/v1/users/ {
            proxy_pass         http://intiva_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
        }

        location /api/v1/onboardings/ {
            proxy_pass         http://intiva_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
        }

        # Finances Context - Transactions & Spending Limits Bounded Context
        location /api/v1/transactions/ {
            proxy_pass         http://intiva_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
        }

        # Savings Context - Savings Goals & Contributions Bounded Context
        location /api/v1/saving-goals/ {
            proxy_pass         http://intiva_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
        }

        # Categories Context - Payment Methods & Categories Bounded Context
        location /api/v1/categories/ {
            proxy_pass         http://intiva_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
        }

        # Subscriptions Context - Subscription Bounded Context
        location /api/v1/subscriptions/ {
            proxy_pass         http://intiva_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
        }

        # Accounts Context - Profiles and Household Bounded Contexts
        location /api/v1/accounts/ {
            proxy_pass         http://intiva_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
        }

        # Analytics Context - Reports and Analytics Bounded Context
        location /api/v1/analytics/ {
            proxy_pass         http://intiva_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
        }

        # Swagger UI - API Documentation interface
        location /swagger-ui/ {
            proxy_pass         http://intiva_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # OpenAPI Docs - Raw API Documentation payload
        location /v3/api-docs {
            proxy_pass         http://intiva_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Health Check - Spring Actuator Endpoint
        # Used by external monitors (e.g. Load Balancers) to verify system state.
        # Access log is off to prevent flooding log files with health checks.
        location /actuator/health {
            proxy_pass         http://intiva_backend/actuator/health;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            access_log off;
        }

        # Block any other request.
        # Serves as a catch-all block to prevent accessing endpoints that are not explicitly allowed.
        # Port 8080 is never exposed to the outside.
        # Returns a JSON error with HTTP 404 status.
        location / {
            return 404 '{"error": "Not Found"}';
            add_header Content-Type application/json;
        }
    }
}
