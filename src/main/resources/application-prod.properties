# Production profile for deployed environments.

# Server
server.port=${PORT:8080}

# Required: Tell Spring it's behind a reverse proxy (Nginx)
server.forward-headers-strategy=framework

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.database=0
spring.data.redis.password=${REDIS_PASSWORD:}
spring.cache.type=redis

# JPA / Hibernate
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.redis.enabled=true

# Firebase Configuration Properties
integrations.fcm.enabled=${INTEGRATIONS_FCM_ENABLED:false}
firebase.project.id=${FIREBASE_PROJECT_ID:}
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}
